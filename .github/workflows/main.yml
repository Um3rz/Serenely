name: Ping Neon Postgres Keep-Alive

on:
  schedule:
    # Runs at minute 0 past every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to trigger the action manually for testing

jobs:
  ping-database:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Neon DB
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: NEON_DATABASE_URL secret is not set."
            exit 1
          fi
          
          # Connects to the DB and runs a lightweight query to wake it up
          psql "$DATABASE_URL" -c "SELECT 1;"
